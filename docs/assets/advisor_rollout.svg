<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="460" viewBox="0 0 1320 460" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Privileged advisor intervention during rollout generation</title>
  <desc id="desc">A public solver trajectory produces a draft and passes through a review gate. If no review is required, the draft is committed. If review is required, a private advisor uses privileged context and either accepts the draft or supplies a safe cue for solver revision. Only the selected solver response is committed.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-private" viewBox="0 0 10 10" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B45309"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .title { font-size: 22px; font-weight: 700; }
      .sub { font-size: 16px; font-weight: 400; fill: #334155; }
      .lane { font-size: 15px; font-weight: 700; letter-spacing: 0.6px; fill: #64748B; }
      .edge-label { font-size: 15px; font-weight: 700; fill: #475569; }
      .edge-label-private { font-size: 15px; font-weight: 700; fill: #92400E; }
      .caption { font-size: 16px; font-style: italic; fill: #475569; }
      .public-box { fill: #EEF5FF; stroke: #4F6B8A; stroke-width: 2; }
      .private-box { fill: #FFF4E8; stroke: #B45309; stroke-width: 2; }
      .final-box { fill: #ECF8F1; stroke: #2F7D5C; stroke-width: 2.2; }
      .public-edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .private-edge { fill: none; stroke: #B45309; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-private); }
      .divider { stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 5 7; }
    </style>
  </defs>

  <rect x="0" y="0" width="1320" height="460" fill="#FFFFFF"/>

  <!-- ===== Public lane ===== -->
  <text class="label lane" x="30" y="32">PUBLIC SOLVER TRAJECTORY</text>

  <rect class="public-box" x="30" y="60" width="230" height="100" rx="10"/>
  <text class="label title" x="145" y="104" text-anchor="middle">Public context</text>
  <text class="label sub" x="74.4" y="132">task x and history h</text>
  <text class="label sub" x="212.3" y="136" style="font-size:12px">t</text>

  <rect class="public-box" x="310" y="60" width="220" height="100" rx="10"/>
  <text class="label title" x="420" y="104" text-anchor="middle">Solver draft</text>
  <text class="label sub" x="382.0" y="132">π</text>
  <text class="label sub" x="393.1" y="136" style="font-size:12px">θ</text>
  <text class="label sub" x="399.8" y="132">(· | x, h</text>
  <text class="label sub" x="449.3" y="136" style="font-size:12px">t</text>
  <text class="label sub" x="452.6" y="132">)</text>

  <polygon class="public-box" points="700,46 840,110 700,174 560,110"/>
  <text class="label title" x="700" y="106" text-anchor="middle">Review?</text>
  <text class="label sub" x="700" y="130" text-anchor="middle">finish or every k turns</text>

  <rect class="final-box" x="1000" y="54" width="280" height="112" rx="10"/>
  <text class="label title" x="1140" y="92" text-anchor="middle">Commit selected</text>
  <text class="label title" x="1079.3" y="119">response y</text>
  <text class="label title" x="1195.4" y="125" style="font-size:16px">t</text>
  <text class="label sub" x="1140" y="146" text-anchor="middle">saved to the trajectory</text>

  <path class="public-edge" d="M260 110 H310"/>
  <path class="public-edge" d="M530 110 H560"/>
  <path class="public-edge" d="M840 110 H1000"/>
  <text class="label edge-label" x="920" y="100" text-anchor="middle">no review</text>

  <!-- ===== Divider ===== -->
  <line class="divider" x1="30" y1="198" x2="1290" y2="198"/>
  <text class="label lane" x="30" y="226">PRIVATE REVIEW PATH</text>

  <!-- ===== Private lane ===== -->
  <rect class="private-box" x="30" y="270" width="330" height="110" rx="10"/>
  <text class="label title" x="195" y="309" text-anchor="middle">Privileged context z</text>
  <text class="label sub" x="195" y="337" text-anchor="middle">reference solution and hidden tests</text>
  <text class="label sub" x="195" y="360" text-anchor="middle">never enters the solver sandbox</text>

  <rect class="private-box" x="560" y="270" width="280" height="110" rx="10"/>
  <text class="label title" x="642.7" y="309">Advisor A</text>
  <text class="label title" x="745.8" y="315" style="font-size:16px">φ</text>
  <text class="label sub" x="640.5" y="337">typed decision d</text>
  <text class="label sub" x="756.2" y="341" style="font-size:12px">t</text>
  <text class="label sub" x="700" y="360" text-anchor="middle">CONTINUE or INTERVENE</text>

  <rect class="public-box" x="960" y="270" width="340" height="110" rx="10"/>
  <text class="label title" x="1130" y="309" text-anchor="middle">Solver revision</text>
  <text class="label sub" x="1019.8" y="337">safe cue I(d</text>
  <text class="label sub" x="1103.4" y="341" style="font-size:12px">t</text>
  <text class="label sub" x="1106.8" y="337">); solver derives fix</text>
  <text class="label sub" x="1130" y="360" text-anchor="middle">finish withheld when more work is needed</text>

  <!-- review gate -> advisor -->
  <path class="private-edge" d="M700 174 V270"/>
  <text class="label edge-label-private" x="690" y="252" text-anchor="end">review</text>

  <!-- privileged context -> advisor -->
  <path class="private-edge" d="M360 325 H560"/>

  <!-- advisor -> solver revision -->
  <path class="private-edge" d="M840 325 H960"/>
  <text class="label edge-label-private" x="900" y="314" text-anchor="middle">INTERVENE</text>

  <!-- advisor CONTINUE -> commit -->
  <path class="public-edge" d="M790 270 V242 Q790 234 798 234 H1052 Q1060 234 1060 226 V166"/>
  <text class="label edge-label" x="925" y="226" text-anchor="middle">CONTINUE: keep draft</text>

  <!-- solver revision -> commit -->
  <path class="public-edge" d="M1220 270 V166"/>
  <text class="label edge-label" x="1230" y="222">revised</text>
  <text class="label edge-label" x="1230" y="240">response</text>

  <text class="label caption" x="660" y="428" text-anchor="middle">Privileged evidence guides where to investigate; the solver still derives and executes the solution.</text>
</svg>
