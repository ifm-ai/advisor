name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,results]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check src tests examples results scripts
      - name: Type-check
        run: mypy
      - name: Test
        run: python -m pytest --cov=ifm_advisor --cov-report=term-missing --cov-fail-under=90
      - name: Offline example
        run: python examples/01_offline_quickstart.py
      - name: Compile the endpoint examples
        run: python -m py_compile examples/02_custom_agent_loop.py examples/03_harbor_mini_swe_agent.py examples/check_reasoning_prefill.py
      - name: Docs
        run: mkdocs build --strict
      - name: Package
        run: |
          python -m build
          python -m twine check dist/*

  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Render every Mermaid diagram
        run: python scripts/check_mermaid.py
